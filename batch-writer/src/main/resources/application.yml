spring:
  application:
    name: batch-writer
  main:
    # Der batch-writer hat keinen Webserver. Diese Zeile sagt Spring
    # ausdrücklich: auch ohne Webserver weiterlaufen, bis jemand stoppt.
    keep-alive: true
  rabbitmq:
    # Im Docker-Netz heisst der Broker "rabbitmq". Beim Start ausserhalb
    # von Docker greift der Vorgabewert "localhost".
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  datasource:
    # reWriteBatchedInserts=true: der PostgreSQL-Treiber fasst die Zeilen
    # eines batchUpdate zu mehrzeiligen INSERTs zusammen. Ohne diese
    # Einstellung schickt er trotz batchUpdate jede Zeile einzeln.
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB:chat}?reWriteBatchedInserts=true
    username: ${POSTGRES_USER:chat}
    password: ${POSTGRES_PASSWORD:chat}

logging:
  level:
    # Im Unterricht wollen wir jeden Schritt sehen.
    ch.benedict.m321: DEBUG
