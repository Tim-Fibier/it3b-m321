spring:
  application:
    name: chat-service
  rabbitmq:
    # Im Docker-Netz heisst der Broker "rabbitmq". Beim Start ausserhalb
    # von Docker greift der Vorgabewert "localhost".
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

server:
  port: 8080

chat-service:
  # Jede Instanz braucht eine eigene Live-Queue. Docker setzt HOSTNAME in
  # jedem Container auf dessen kurze ID, auch bei --scale. Ausserhalb von
  # Docker greift der Vorgabewert "local".
  instance-id: ${HOSTNAME:local}

logging:
  level:
    # Im Unterricht wollen wir jeden Schritt sehen.
    ch.benedict.m321: DEBUG
