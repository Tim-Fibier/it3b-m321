spring:
  application:
    name: chat-service
  
  datasource:
    url: jdbc:postgresql://postgres:5432/chat_db
    username: chat_user
    password: chat_password
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  
  data:
    redis:
      host: redis
      port: 6379
      timeout: 60000ms

  jackson:
    serialization:
      write-dates-as-timestamps: false

  security:
    oauth2:
      resourceserver:
        jwt:
          # jwk-set-uri nutzt den internen Docker-Hostnamen (Schluessel-Abruf zwischen Containern).
          # issuer-uri muss dagegen exakt dem "iss"-Claim entsprechen, den Keycloak in Tokens
          # einsetzt - und das ist die oeffentliche URL, ueber die der Browser via Gateway
          # einloggt (http://localhost/auth -> KC_HOSTNAME=localhost, Zugriff ueber Port 80).
          jwk-set-uri: ${KEYCLOAK_URL:http://keycloak:8080}/realms/chat/protocol/openid-connect/certs
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost/realms/chat}

server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    ch.bzz.m321: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
