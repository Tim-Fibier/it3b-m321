version: '3.9'

services:

  # ===== PostgreSQL =====
  postgres:
    image: postgres:16-alpine
    container_name: m321-postgres
    environment:
      POSTGRES_DB: chat_db
      POSTGRES_USER: chat_user
      POSTGRES_PASSWORD: chat_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - m321-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat_user -d chat_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== Redis =====
  redis:
    image: redis:7-alpine
    container_name: m321-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - m321-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== Keycloak =====
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: m321-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
      KC_HOSTNAME_STRICT: 'false'
      KC_HTTP_ENABLED: 'true'
    ports:
      - "8080:8080"
    networks:
      - m321-network
    depends_on:
      postgres:
        condition: service_healthy
    command: ["start-dev"]

  # ===== Chat Service (Instanz 1) =====
  chat-service-1:
    build:
      context: ./chat-service
      dockerfile: Dockerfile
    container_name: m321-chat-service-1
    environment:
      SPRING_APPLICATION_NAME: chat-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/chat_db
      SPRING_DATASOURCE_USERNAME: chat_user
      SPRING_DATASOURCE_PASSWORD: chat_password
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      KEYCLOAK_URL: http://keycloak:8080
      SERVER_PORT: 8081
    ports:
      - "8081:8081"
    networks:
      - m321-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== Chat Service (Instanz 2) =====
  chat-service-2:
    build:
      context: ./chat-service
      dockerfile: Dockerfile
    container_name: m321-chat-service-2
    environment:
      SPRING_APPLICATION_NAME: chat-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/chat_db
      SPRING_DATASOURCE_USERNAME: chat_user
      SPRING_DATASOURCE_PASSWORD: chat_password
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      KEYCLOAK_URL: http://keycloak:8080
      SERVER_PORT: 8082
    ports:
      - "8082:8082"
    networks:
      - m321-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== Batch Service =====
  batch-service:
    build:
      context: ./batch-service
      dockerfile: Dockerfile
    container_name: m321-batch-service
    environment:
      SPRING_APPLICATION_NAME: batch-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/chat_db
      SPRING_DATASOURCE_USERNAME: chat_user
      SPRING_DATASOURCE_PASSWORD: chat_password
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SERVER_PORT: 8083
    ports:
      - "8083:8083"
    networks:
      - m321-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ===== nginx Gateway =====
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: m321-gateway
    ports:
      - "80:80"
      - "443:443"
    networks:
      - m321-network
    depends_on:
      - chat-service-1
      - chat-service-2
      - keycloak
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./web-ui:/usr/share/nginx/html:ro

volumes:
  postgres_data:
  redis_data:

networks:
  m321-network:
    driver: bridge
