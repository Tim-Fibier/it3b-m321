user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Upstream für Chat Service Instanzen
    upstream chat_service {
        least_conn;
        server chat-service-1:8081;
        server chat-service-2:8082;
    }

    server {
        listen 80 default_server;
        server_name _;

        # Statische HTML/CSS/JS Dateien
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html =404;
            expires 24h;
            add_header Cache-Control "public, immutable";
        }

        # REST API für Messages
        location /api/ {
            proxy_pass http://chat_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Passthrough Authorization Header
            proxy_pass_header Authorization;
            proxy_pass_header X-Access-Token;
        }

        # WebSocket Endpoint
        location /ws {
            proxy_pass http://chat_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket Timeouts
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # Passthrough Authorization Header
            proxy_pass_header Authorization;
            proxy_pass_header X-Access-Token;
        }

        # Keycloak Auth
        location /auth/ {
            proxy_pass http://keycloak:8080/auth/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health Check
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
