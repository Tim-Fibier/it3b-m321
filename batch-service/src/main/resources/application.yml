spring:
  application:
    name: batch-service
  
  datasource:
    url: jdbc:postgresql://postgres:5432/chat_db
    username: chat_user
    password: chat_password
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  
  data:
    redis:
      host: redis
      port: 6379
      timeout: 60000ms

  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8083}
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    ch.bzz.m321: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Batch Konfiguration
batch:
  size: 50
  flush-interval-ms: 5000
